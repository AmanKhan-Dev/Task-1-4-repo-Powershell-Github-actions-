# GitHub Actions workflow for PowerShell deployment
name: PowerShell Deployment CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      # 1. Download the code from the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Run Pester Tests
        shell: powershell
        run: |
          $result = Invoke-Pester -Script .\Script_Test.ps1 -PassThru
          if ($result.FailedCount -gt 0) {
              Write-Error "Tests failed"
              exit 1
          }

      # Run the deployment script
      - name: Run Deployment Script
        shell: powershell
        run: .\Script.ps1

      # Show the log file contents 
      - name: Show logs
        if: always()
        shell: powershell
        run: |
          if (Test-Path ".\SetupLogs.log") {
              Get-Content ".\SetupLogs.log"
          }

      # Save log file 
      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: SetupLogs.log
          if-no-files-found: warn
